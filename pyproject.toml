[project]
name = "vectorvault-mcp"
version = "0.2.0"
description = "A local MCP server for retrieval over document collections"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.0.0",
    "httpx>=0.28.0",
    "mcp[cli]>=1.9,<2",
    "openai>=1.60.0",
    "openpyxl>=3.1.5",
    "pypdf>=6.7.0",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "trafilatura>=2.0.0",
    "uvicorn>=0.34.0",
]

[project.optional-dependencies]
ocr = [
    "pypdfium2>=5.15.2",
]
